<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071713"><title>Dinliminate</title></head>
<body style="margin:0;min-height:100vh;background:#071713;color:#f7f2e9;font:700 16px system-ui, sans-serif;display:grid;place-items:center">
<div style="text-align:center;padding:24px"><div style="font-size:34px;margin-bottom:12px">🍽️</div><div>Starting Dinliminate…</div></div>
<script>
(async()=>{
  try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister().catch(()=>false)));}}catch{}
  try{if('caches' in window){const names=await caches.keys();await Promise.all(names.filter(n=>/dinliminate/i.test(String(n))).map(n=>caches.delete(n)));}}catch{}
  try{localStorage.setItem('dinliminateBootVersion','p634');}catch{}
  location.replace('/?__dinliminate_boot=p634&n='+Date.now());
})();
</script></body></html>
