# P729 full virtual-user regression runner
name: Dinliminate launch QA
on:
  push:
    branches: [ main, launch-complete-2026-09-27 ]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Source integrity check
        run: node qa/source-check.mjs
      - name: API unit and fallback regression tests
        run: node qa/api_unit_test.js
      - name: Real-provider Wendy and semantic restaurant search
        run: node qa/api_live_search_test.mjs
      - name: Install Playwright
        if: github.ref == 'refs/heads/main'
        run: npm install --no-save --no-package-lock @playwright/test
      - name: Install Chromium
        if: github.ref == 'refs/heads/main'
        run: npx playwright install --with-deps chromium
      - name: Start local QA server
        run: |
          node qa/local-smoke-server.mjs > /tmp/dinliminate-qa-server.log 2>&1 &
          echo $! > /tmp/dinliminate-qa-server.pid
      - name: Wait for local QA server
        run: node -e "const u='http://127.0.0.1:4173/'; const end=Date.now()+30000; (async()=>{while(Date.now()<end){try{const r=await fetch(u); const t=await r.text(); if(r.ok&&t.includes('Dinliminate')) process.exit(0)}catch{} await new Promise(s=>setTimeout(s,1000))} console.error('Local QA server did not start'); process.exit(1)})()"
      - name: Run launch smoke suite
        env:
          DINLIMINATE_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test qa/launch-smoke.spec.mjs --reporter=line
      - name: Install Python Playwright for deep browser audit
        run: python3 -m pip install --disable-pip-version-check playwright
      - name: Run deep browser audit
        run: python3 qa/final_browser_audit.py
      - name: Archive deep browser audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dinliminate-deep-browser-audit
          path: |
            qa/final-browser-results.json
            qa/p636-final-iphone.png
          if-no-files-found: warn

  restaurant_quickcut_focus:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: npm install --no-save --no-package-lock @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local QA server
        run: |
          node qa/local-smoke-server.mjs > /tmp/dinliminate-quickcut-qa.log 2>&1 &
          echo $! > /tmp/dinliminate-quickcut-qa.pid
      - name: Wait for local QA server
        run: node -e "const u='http://127.0.0.1:4173/'; const end=Date.now()+30000; (async()=>{while(Date.now()<end){try{const r=await fetch(u); const t=await r.text(); if(r.ok&&t.includes('Dinliminate')) process.exit(0)}catch{} await new Promise(s=>setTimeout(s,500))} console.error('Local QA server did not start'); process.exit(1)})()"
      - name: Run deterministic restaurant Quick Cut regression
        env:
          DINLIMINATE_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test qa/launch-smoke.spec.mjs --grep "deterministic live restaurant Quick Cut scope" --reporter=line
