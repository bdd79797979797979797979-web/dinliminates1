name: Dinliminate launch QA
on:
  push:
    branches: [ main, launch-complete-2026-09-27 ]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Source integrity check
        run: node qa/source-check.mjs
      - name: Install Playwright
        if: github.ref == 'refs/heads/main'
        run: npm install --no-save --no-package-lock @playwright/test
      - name: Install Chromium
        if: github.ref == 'refs/heads/main'
        run: npx playwright install --with-deps chromium
      - name: Wait for production build
        if: github.ref == 'refs/heads/main'
        env:
          DINLIMINATE_BASE_URL: https://dinliminates1.vercel.app
        run: node - <<'NODE'
        const base = process.env.DINLIMINATE_BASE_URL;
        const start = Date.now();
        while (Date.now() - start < 360000) {
          try {
            const r = await fetch(base + '/');
            const t = await r.text();
            if (r.ok && t.includes('p677-launch-complete')) process.exit(0);
          } catch {}
          await new Promise(r => setTimeout(r, 10000));
        }
        console.error('Production did not expose p677-launch-complete within six minutes.');
        process.exit(1);
NODE
      - name: Run launch smoke suite
        if: github.ref == 'refs/heads/main'
        env:
          DINLIMINATE_BASE_URL: https://dinliminates1.vercel.app
        run: npx playwright test qa/launch-smoke.spec.mjs --reporter=line