name: Dinliminate Hosted Netlify Preview Smoke

on:
  push:
    branches: [release-hardening-2026-09-29]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-netlify-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Hosted smoke
        env:
          BASE_URL: https://deploy-preview-40--diliminate.netlify.app
          REQUIRE_RELEASE: 'false'
        run: node qa/hosted-smoke.mjs
