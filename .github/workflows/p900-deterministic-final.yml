name: Dinliminate P900 deterministic final gate

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'launch-hardening.js'
      - 'launch-hardening.css'
      - 'p636-clean-ui.css'
      - 'api/**'
      - 'netlify/**'
      - 'netlify.toml'
      - 'dinliminate-sw.js'
      - 'dinliminate.webmanifest'
      - 'qa/p900-launch-complete.spec.mjs'
      - 'qa/p730-final-state.spec.mjs'
      - 'qa/local-smoke-server.mjs'
      - 'qa/source-check.mjs'
      - 'qa/restaurant-search-contract.mjs'
      - 'qa/api_unit_test.js'
      - '.github/workflows/p900-deterministic-final.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --no-package-lock @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: node qa/source-check.mjs
      - run: node qa/api_unit_test.js
      - run: node qa/restaurant-search-contract.mjs
      - run: node qa/local-smoke-server.mjs > /tmp/dinliminate-qa-server.log 2>&1 &
      - run: |
          node -e "const u='http://127.0.0.1:4173/';const end=Date.now()+30000;(async()=>{while(Date.now()<end){try{const r=await fetch(u);const t=await r.text();if(r.ok&&t.includes('Dinliminate'))process.exit(0)}catch{}await new Promise(s=>setTimeout(s,500))}process.exit(1)})()"
      - run: npx playwright test qa/p730-final-state.spec.mjs qa/p900-launch-complete.spec.mjs --reporter=line
        env:
          DINLIMINATE_BASE_URL: http://127.0.0.1:4173
