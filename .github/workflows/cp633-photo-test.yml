name: CP633 Photo Test
on:
  push:
    branches: [cp633-exact-mcd-photo-proof]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test exact restaurant photos
        env:
          BASE_URL: https://deploy-preview-111--dinliminate.netlify.app
        run: |
          node <<'NODE'
          const base=process.env.BASE_URL;
          const cases=[
            ["McDonald's","724 Sango Rd, Clarksville, TN 37043"],
            ["The Thirsty Goat","4044 US-41 ALT South, Clarksville, TN 37043"]
          ];
          for(const [name,address] of cases){
            const u=base+'/api/restaurant-photo?name='+encodeURIComponent(name)+'&address='+encodeURIComponent(address);
            const r=await fetch(u);
            const type=(r.headers.get('content-type')||'').split(';')[0];
            const source=r.headers.get('x-restaurant-photo-source')||'';
            const sourceUrl=r.headers.get('x-restaurant-photo-source-url')||'';
            const body=await r.arrayBuffer();
            console.log(JSON.stringify({name,status:r.status,type,source,sourceUrl,bytes:body.byteLength}));
            if(r.status!==200||!type.startsWith('image/'))throw new Error(name+' photo test failed');
            if(name==="McDonald's" && !/tripadvisor/i.test(sourceUrl))throw new Error("McDonald's was not sourced from the exact Tripadvisor location photo");
          }
          NODE
