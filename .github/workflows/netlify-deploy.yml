name: Dinliminate Netlify production deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'launch-hardening.js'
      - 'launch-hardening.css'
      - 'api/**'
      - 'netlify.toml'
      - 'netlify/functions/**'
      - 'p636-clean-ui.css'
      - 'dinliminate.webmanifest'
      - 'dinliminate-sw.js'
      - 'dinliminate-icon-180.png'
      - 'dinliminate-icon-512.png'

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ secrets.NETLIFY_AUTH_TOKEN != '' && secrets.NETLIFY_SITE_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npx netlify-cli@latest deploy --prod --dir=. --functions=netlify/functions --site="${{ secrets.NETLIFY_SITE_ID }}" --auth="${{ secrets.NETLIFY_AUTH_TOKEN }}"
