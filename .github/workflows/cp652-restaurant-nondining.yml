name: Dinliminate CP652 Restaurant Non-Dining Regression

on:
  pull_request:
    branches: [main]
    paths:
      - "api/restaurants.js"
      - "data/restaurant-taxonomy.js"
      - "qa/restaurant-classification-smoke.cjs"
      - ".github/workflows/cp652-restaurant-nondining.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run restaurant classification regression
        run: node qa/restaurant-classification-smoke.cjs
