name: Dinliminate Hosted Vercel Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Hosted Vercel URL"
        required: true
        type: string

permissions:
  contents: read

jobs:
  hosted-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Hosted smoke
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: node qa/hosted-smoke.mjs
