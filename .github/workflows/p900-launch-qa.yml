name: Dinliminate P900 Launch QA

on:
  push:
    branches:
      - launch-complete-2026-09-29
      - main
    paths:
      - 'index.html'
      - 'launch-hardening.js'
      - 'launch-hardening.css'
      - 'api/**'
      - 'netlify/**'
      - 'netlify.toml'
      - 'dinliminate-sw.js'
      - 'dinliminate.webmanifest'
      - 'qa/p900-launch-complete.spec.mjs'
      - '.github/workflows/p900-launch-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --no-package-lock @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: node qa/local-smoke-server.mjs > /tmp/dinliminate-qa-server.log 2>&1 &
      - run: |
          node -e "const u='http://127.0.0.1:4173/';const end=Date.now()+30000;(async()=>{while(Date.now()<end){try{const r=await fetch(u);const t=await r.text();if(r.ok&&t.includes('Dinliminate'))process.exit(0)}catch{}await new Promise(s=>setTimeout(s,500))}process.exit(1)})()"
      - run: npx playwright test qa/p730-final-state.spec.mjs qa/p900-launch-complete.spec.mjs --reporter=line
        env:
          DINLIMINATE_BASE_URL: http://127.0.0.1:4173

  production_contract:
    if: github.ref == 'refs/heads/main'
    needs: local_contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --no-package-lock @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Wait for matching Vercel production commit
        env:
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -eu
          end=$((SECONDS+540))
          while [ $SECONDS -lt $end ]; do
            json=$(curl -fsSL https://dinliminates1.vercel.app/api/release || true)
            sha=$(node -e "try{const j=JSON.parse(process.argv[1]);process.stdout.write(j.sha||'')}catch{}" "$json")
            ref=$(node -e "try{const j=JSON.parse(process.argv[1]);process.stdout.write(j.ref||'')}catch{}" "$json")
            envv=$(node -e "try{const j=JSON.parse(process.argv[1]);process.stdout.write(j.environment||'')}catch{}" "$json")
            echo "production sha=$sha ref=$ref env=$envv current=$CURRENT_SHA"
            if [ "$sha" = "$CURRENT_SHA" ] && [ "$ref" = "main" ] && [ "$envv" = "production" ]; then exit 0; fi
            sleep 10
          done
          echo "Vercel production did not reach the current commit."
          exit 1
      - run: npx playwright test qa/p900-launch-complete.spec.mjs --reporter=line
        env:
          DINLIMINATE_BASE_URL: https://dinliminates1.vercel.app
