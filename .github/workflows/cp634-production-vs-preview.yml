name: CP634 Production vs Preview Photo Diagnosis
on:
  push:
    branches: [cp634-photo-diagnosis]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Compare photo endpoints
        run: |
          node <<'NODE'
          const bases=[
            ["production","https://dinliminate.netlify.app"],
            ["corrected-preview","https://deploy-preview-111--dinliminate.netlify.app"]
          ];
          const cases=[
            ["McDonald's","724 Sango Rd, Clarksville, TN 37043"],
            ["The Thirsty Goat","4044 US-41 ALT South, Clarksville, TN 37043"]
          ];
          for(const [label,base] of bases){
            for(const [name,address] of cases){
              try{
                const r=await fetch(base+'/api/restaurant-photo?name='+encodeURIComponent(name)+'&address='+encodeURIComponent(address),{redirect:'follow'});
                const type=(r.headers.get('content-type')||'').split(';')[0];
                const source=r.headers.get('x-restaurant-photo-source')||'';
                const sourceUrl=r.headers.get('x-restaurant-photo-source-url')||'';
                const bytes=(await r.arrayBuffer()).byteLength;
                console.log(JSON.stringify({label,name,status:r.status,type,source,sourceUrl,bytes}));
              }catch(e){console.log(JSON.stringify({label,name,error:e.message}))}
            }
          }
          NODE
