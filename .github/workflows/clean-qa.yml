name: Dinliminate Clean QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'data/**'
      - 'api/**'
      - 'qa/**'
      - '.github/workflows/clean-qa.yml'
  push:
    branches: [clean-rebuild, clean-release-candidate]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static QA
        run: node qa/clean-static-qa.js
      - name: Real provider smoke
        run: node qa/api-smoke.cjs
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke
        run: node qa/browser-smoke.mjs
