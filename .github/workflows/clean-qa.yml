name: Dinliminate Clean QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'data/**'
      - 'api/**'
      - 'qa/**'
      - '.github/workflows/clean-qa.yml'
      - 'manifest.webmanifest'
      - 'vercel.json'
      - 'sw.js'
      - 'release.json'
      - 'icon.svg'
      - '*.png'
      - 'README.md'
      - 'CHECKPOINT.md'
      - 'SAVEPOINTS.md'
      - 'CURRENT-RELEASE.md'
  push:
    branches: [clean-rebuild, clean-release-candidate, release-hardening-2026-09-29, 'cp*-launch-hardening']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dinliminate-clean-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Static QA
        run: node qa/clean-static-qa.js
      - name: Real provider smoke
        run: node qa/api-smoke.cjs
      - name: Route adapter smoke
        run: node qa/restaurant-route-smoke.cjs
      - name: Restaurant classification smoke
        run: node qa/restaurant-classification-smoke.cjs
      - name: Restaurant dedupe smoke
        run: node qa/restaurant-dedupe-smoke.cjs
      - name: Food image smoke
        run: node qa/food-image-smoke.mjs
      - name: Provider failure smoke
        run: node qa/provider-failure-smoke.cjs
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0 pngjs@7.0.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke
        run: node qa/browser-smoke.mjs
      - name: Accessibility smoke
        run: node qa/accessibility-smoke.mjs
      - name: Performance budget
        run: node qa/performance-budget.mjs

      - name: Visual regression
        run: node qa/visual-regression.mjs
      - name: Upload visual QA artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dinliminate-visual-qa
          path: qa-artifacts/
          if-no-files-found: ignore
