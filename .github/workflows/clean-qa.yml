name: Dinliminate Clean QA

on:
  push:
    branches:
      - main
      - 'cp*-audit-*'
      - 'cp*-launch-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dinliminate-clean-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clean-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Static QA
        run: node qa/clean-static-qa.js

      - name: Real provider smoke
        run: node qa/api-smoke.cjs

      - name: Route adapter smoke
        run: node qa/restaurant-route-smoke.cjs

      - name: Restaurant classification smoke
        run: node qa/restaurant-classification-smoke.cjs

      - name: Restaurant dedupe smoke
        run: node qa/restaurant-dedupe-smoke.cjs
      - name: Hybrid restaurant search smoke
        run: node qa/restaurant-hybrid-search-smoke.cjs
      - name: Restaurant radius discovery smoke
        run: node qa/restaurant-radius-discovery-smoke.cjs
      - name: Restaurant search reliability smoke
        run: node qa/restaurant-search-reliability-smoke.cjs
      - name: Restaurant contact enrichment merge smoke
        run: node qa/restaurant-contact-enrichment-smoke.cjs
      - name: Install Playwright for six-point certification
        run: npm install --no-save playwright@1.55.0 pngjs@7.0.0

      - name: Install Chromium for six-point certification
        run: npx playwright install --with-deps chromium

      - name: Six-point restaurant search certification
        run: node qa/restaurant-six-point-certification.mjs

      - name: Restaurant hours model smoke
        run: node qa/restaurant-hours-model-smoke.cjs




      - name: Food image smoke
        run: node qa/food-image-smoke.mjs

      - name: Image source governance audit
        run: node qa/image-source-audit.cjs

      - name: Provider failure smoke
        run: node qa/provider-failure-smoke.cjs

      - name: Application Syntax
        run: node --check app.js && node --check data/foods.js && node --check qa/browser-smoke.mjs

      - name: Browser smoke
        run: node qa/browser-smoke.mjs
      - name: iPhone optimization smoke
        if: ${{ vars.NETLIFY_PREVIEW_URL != '' }}
        env:
          BASE_URL: ${{ vars.NETLIFY_PREVIEW_URL }}
        run: node qa/iphone-optimization-smoke.mjs

      - name: iPhone optimization smoke not configured
        if: ${{ vars.NETLIFY_PREVIEW_URL == '' }}
        run: echo 'NETLIFY_PREVIEW_URL is not configured; hosted iPhone smoke is intentionally skipped.'

      - name: Accessibility smoke
        run: node qa/accessibility-smoke.mjs

      - name: Performance budget
        run: node qa/performance-budget.mjs

      - name: Visual regression
        run: node qa/visual-regression.mjs

      - name: Visual surface smoke
        run: node qa/visual-regression.mjs --surface-smoke

      - name: Netlify preview smoke
        if: ${{ vars.NETLIFY_PREVIEW_URL != '' }}
        env:
          BASE_URL: ${{ vars.NETLIFY_PREVIEW_URL }}
        run: node qa/netlify-preview-smoke.mjs

      - name: Netlify preview smoke not configured
        if: ${{ vars.NETLIFY_PREVIEW_URL == '' }}
        run: echo 'NETLIFY_PREVIEW_URL is not configured; hosted Netlify smoke is intentionally skipped.'

      - name: Upload visual QA artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dinliminate-visual-qa
          path: qa-artifacts/
          if-no-files-found: ignore
