name: Dinliminate P730 Final-State QA
on:
  push:
    paths:
      - 'index.html'
      - 'launch-hardening.js'
      - 'qa/p730-final-state.spec.mjs'
      - '.github/workflows/p730-final-state.yml'
jobs:
  final_state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --no-package-lock @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: node qa/local-smoke-server.mjs > /tmp/dinliminate-qa-server.log 2>&1 &
      - run: node -e "const u='http://127.0.0.1:4173/';const end=Date.now()+30000;(async()=>{while(Date.now()<end){try{const r=await fetch(u);const t=await r.text();if(r.ok&&t.includes('Dinliminate'))process.exit(0)}catch{}await new Promise(s=>setTimeout(s,500))}process.exit(1)})()"
      - run: npx playwright test qa/p730-final-state.spec.mjs --reporter=line
        env:
          DINLIMINATE_BASE_URL: http://127.0.0.1:4173
