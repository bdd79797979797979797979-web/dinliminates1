name: Dinliminate Live Netlify Smoke

on:
  push:
    branches: [cp487-launch-candidate-full-pass-2026-10-01]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node qa/netlify-preview-smoke.mjs
