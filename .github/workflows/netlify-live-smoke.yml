name: Dinliminate Live Netlify Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Production smoke
        if: ${{ vars.NETLIFY_PRODUCTION_URL != '' }}
        env:
          BASE_URL: ${{ vars.NETLIFY_PRODUCTION_URL }}
        run: node qa/hosted-smoke.mjs
      - name: Production smoke not configured
        if: ${{ vars.NETLIFY_PRODUCTION_URL == '' }}
        run: echo 'NETLIFY_PRODUCTION_URL is not configured; production smoke is intentionally skipped.'
