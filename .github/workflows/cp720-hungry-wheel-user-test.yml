name: CP720 Hungry Wheel User Test

on:
  push:
    branches: [cp715-restaurant-maybe-home-winner]
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  hungry-wheel-user-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Hungry wheel browser test
        run: node qa/cp720-hungry-wheel-user-test.cjs