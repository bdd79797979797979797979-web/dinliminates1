name: CP643 Restaurant Photo QA

on:
  push:
    branches:
      - cp643-restaurant-photo-rebuild

permissions:
  contents: read

jobs:
  photo-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Syntax
        run: node --check api/restaurant-photo.js && node --check api/restaurants.js && node --check app.js && node --check qa/restaurant-photo-smoke.cjs
      - name: Restaurant photo smoke
        run: node qa/restaurant-photo-smoke.cjs
