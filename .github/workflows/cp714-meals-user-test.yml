name: CP714 Meals User Test

on:
  push:
    branches: [cp714-manage-order-button-size-about-cleanup]
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  meals-user-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout CP714
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full Meals browser user test
        id: meals-test
        shell: bash
        run: |
          set +e
          node qa/cp714-meals-user-test.cjs 2>&1 | tee qa/cp714-meals-user-test-output.txt
          code=${PIPESTATUS[0]}
          {
            echo "commit: ${GITHUB_SHA}"
            echo "branch: ${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            echo "exit_code: ${code}"
            echo
            cat qa/cp714-meals-user-test-output.txt
          } > qa/cp714-meals-user-test-result.txt
          exit ${code}

      - name: Commit browser test result to QA branch
        if: always() && !contains(github.event.head_commit.message, '[qa-report]')
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/cp714-meals-user-test-output.txt qa/cp714-meals-user-test-result.txt
          git diff --cached --quiet || git commit -m "[qa-report] CP714 Meals browser user test result"
          target="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${target}"

      - name: Upload QA screenshots/logs if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp714-meals-user-test-artifacts
          path: |
            qa-artifacts
            /tmp/server.log
          if-no-files-found: ignore
