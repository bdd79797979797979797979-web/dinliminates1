name: CP605 API Photo Test

on:
  push:
    branches: [cp605-thirsty-goat-photo-fix]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test restaurant photo API
        env:
          BASE_URL: https://deploy-preview-99--dinliminate.netlify.app
        run: |
          node <<'NODE'
          const base=process.env.BASE_URL;
          for(const [name,address] of [
            ["McDonald's","724 Sango Rd, Clarksville, TN 37043"],
            ["The Thirsty Goat","4044 US-41 ALT South, Clarksville, TN 37040"]
          ]){
            const r=await fetch(base+'/api/restaurant-photo?name='+encodeURIComponent(name)+'&address='+encodeURIComponent(address));
            const type=(r.headers.get('content-type')||'').split(';')[0];
            const source=r.headers.get('x-restaurant-photo-source')||'';
            const body=await r.text();
            let j=null;try{j=JSON.parse(body)}catch{}
            console.log(JSON.stringify({name,status:r.status,type,source,url:j?.url||'',jsonSource:j?.source||'',bytes:body.length}));
          }
          NODE
