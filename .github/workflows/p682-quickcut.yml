name: Dinliminate P682 restaurant Quick Cut regression
on:
  push:
    branches: [ launch-complete-2026-09-27 ]
  workflow_dispatch:
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Source integrity check
        run: node qa/source-check.mjs
      - name: Install Playwright
        run: npm install --no-save --no-package-lock @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local QA server
        run: node qa/local-smoke-server.mjs > /tmp/dinliminate-qa-server.log 2>&1 &
      - name: Wait for local QA server
        run: node -e "const u='http://127.0.0.1:4173/'; const end=Date.now()+30000; (async()=>{while(Date.now()<end){try{const r=await fetch(u); const t=await r.text(); if(r.ok&&t.includes('Dinliminate')) process.exit(0)}catch{} await new Promise(s=>setTimeout(s,500))} console.error('Local QA server did not start'); process.exit(1)})()"
      - name: Run P682 targeted regression
        env:
          DINLIMINATE_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test qa/launch-smoke.spec.mjs --grep "targeted restaurant Quick Cuts" --reporter=line
