name: Vercel production verification
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Vercel production
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -eu
          for i in $(seq 1 30); do
            body=$(curl -fsSL --max-time 15 https://dinliminates1.vercel.app/api/release || true)
            echo "$body"
            actual=$(printf '%s' "$body" | EXPECTED_SHA="$EXPECTED_SHA" node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{try{const j=JSON.parse(s);console.log(j.sha||'')}catch(e){console.log('')}})")
            if [ "$actual" = "$EXPECTED_SHA" ]; then
              echo "Vercel production matches $EXPECTED_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "Vercel production did not reach $EXPECTED_SHA"
          exit 1
      - name: Verify production entry
        run: |
          set -eu
          node <<'NODE'
          const r = await fetch('https://dinliminates1.vercel.app/');
          const t = await r.text();
          if (!r.ok || !t.includes('Dinliminate')) throw new Error(`Production entry failed: HTTP ${r.status}`);
          console.log('Production entry OK');
          NODE
      - name: Verify restaurant API
        run: |
          set -eu
          node <<'NODE'
          const r = await fetch('https://dinliminates1.vercel.app/api/restaurant-search?mode=health');
          const j = await r.json();
          if (!r.ok || j.ok !== true) throw new Error(`Restaurant API health failed: HTTP ${r.status}`);
          console.log('Restaurant API OK');
          NODE
