name: Deploy Dinliminate to Vercel
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Vercel token
        id: token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::VERCEL_TOKEN is not configured; refusing to report a false deployment success."
            exit 1
          fi
      - name: Deploy existing Vercel project
        id: deploy
        if: steps.token.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TELEMETRY_DISABLED: "1"
          CI: "1"
        run: npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
      - name: Verify release marker
        if: steps.deploy.outcome == 'success'
        run: node -e "fetch('https://dinliminates1.vercel.app/').then(async r=>{const t=await r.text();const release=r.headers.get('x-dinliminate-release');if(!r.ok||release!=='p744-final-launch'||!t.includes('p744-final-launch')){console.error('P744 production release marker is not live on production');process.exit(1)}console.log('Dinliminate P744 is live on production')}).catch(e=>{console.error(e);process.exit(1)})"
