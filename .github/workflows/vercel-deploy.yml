name: Deploy Dinliminate to Vercel
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify Vercel token is configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN GitHub Actions secret is not configured for this repository."
            exit 1
          fi
      - name: Deploy existing Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TELEMETRY_DISABLED: "1"
          CI: "1"
        run: npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN" --scope="bdd79797979797979797979-7642"
      - name: Verify release marker
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node -e "fetch('https://dinliminates1.vercel.app/').then(async r=>{const t=await r.text();if(!r.ok||!t.includes('p682-restaurant-quickcuts-live-sync')){console.error('Release marker not live on production');process.exit(1)}console.log('Dinliminate p681 is live on production')}).catch(e=>{console.error(e);process.exit(1)})"