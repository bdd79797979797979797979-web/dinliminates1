name: Vercel production verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for matching Vercel production commit
        env:
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -eu
          end=$((SECONDS+540))
          while [ $SECONDS -lt $end ]; do
            json=$(curl -fsSL https://dinliminates1.vercel.app/api/release || true)
            sha=$(node -e "try{const j=JSON.parse(process.argv[1]);process.stdout.write(j.sha||'')}catch{}" "$json")
            ref=$(node -e "try{const j=JSON.parse(process.argv[1]);process.stdout.write(j.ref||'')}catch{}" "$json")
            envv=$(node -e "try{const j=JSON.parse(process.argv[1]);process.stdout.write(j.environment||'')}catch{}" "$json")
            echo "production sha=$sha ref=$ref env=$envv current=$CURRENT_SHA"
            if [ "$sha" = "$CURRENT_SHA" ] && [ "$ref" = "main" ] && [ "$envv" = "production" ]; then exit 0; fi
            sleep 10
          done
          echo "Vercel production did not reach the current commit."
          exit 1
      - name: Verify production entry and restaurant API
        run: |
          set -eu
          node <<'NODE'
          const entry = await fetch('https://dinliminates1.vercel.app/');
          const html = await entry.text();
          if (!entry.ok || !html.includes('Dinliminate')) throw new Error('Production entry failed: HTTP '+entry.status);
          const api = await fetch('https://dinliminates1.vercel.app/api/restaurant-search?mode=health');
          const health = await api.json();
          if (!api.ok || health.ok !== true) throw new Error('Restaurant search health failed: HTTP '+api.status);
          console.log('Production entry and restaurant API OK');
          NODE
      - name: Verify current production matches main
        env:
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -eu
          production_sha=$(node -e "fetch('https://dinliminates1.vercel.app/api/release').then(r=>r.json()).then(j=>process.stdout.write(j.sha||''))")
          test "$production_sha" = "$CURRENT_SHA"
