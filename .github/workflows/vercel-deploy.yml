name: Deploy Dinliminate to Vercel
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Vercel token
        id: token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VERCEL_TOKEN is not configured; Vercel deploy will be skipped."
          fi
      - name: Deploy existing Vercel project
        id: deploy
        if: steps.token.outputs.configured == 'true'
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TELEMETRY_DISABLED: "1"
          CI: "1"
        run: npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN" --scope="bdd79797979797979797979-7642"
      - name: Verify release marker
        if: steps.deploy.outcome == 'success'
        run: node -e "fetch('https://dinliminates1.vercel.app/').then(async r=>{const t=await r.text();if(!r.ok||!t.includes('p719-launch-candidate')){console.error('P719 release marker not live on production');process.exit(1)}console.log('Dinliminate P719 is live on production')}).catch(e=>{console.error(e);process.exit(1)})"
      - name: Report skipped or rate-limited deployment
        if: steps.token.outputs.configured != 'true' || steps.deploy.outcome != 'success'
        run: |
          if [ "${{ steps.token.outputs.configured }}" != "true" ]; then
            echo "::notice::Vercel deployment skipped because VERCEL_TOKEN is not configured."
          else
            echo "::warning::Vercel deployment did not complete. Check Vercel build/deployment status."
          fi