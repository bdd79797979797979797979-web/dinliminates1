name: Deploy Dinliminate to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: team_c8XYTeoH7rKJ1QNYgSaFhgwn
      VERCEL_PROJECT_ID: prj_DASfRtpkg1wTCvpUPAGBZAbDDUKr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured for this repository."
            exit 1
          fi
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" --scope=bdd79797979797979797979-7642
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN" --scope=bdd79797979797979797979-7642
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN" --scope=bdd79797979797979797979-7642
