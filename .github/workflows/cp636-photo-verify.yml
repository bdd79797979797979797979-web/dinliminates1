name: CP636 credential-free restaurant photo verification

on:
  push:
    branches:
      - cp636-restaurant-photo-rebuild

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --experimental-fetch
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          node --check api/restaurant-photo.js
          node --check api/restaurants.js
          node --check app.js
      - name: Architecture checks
        run: |
          ! grep -qE 'GOOGLE_PLACES_API_KEY|GOOGLE_MAPS_API_KEY' api/restaurant-photo.js
          ! grep -qE 'images\.unsplash\.com|CATEGORY_IMAGES|function namedImage' api/restaurants.js
          grep -q "osmPhoto" app.js
          grep -q "VERIFIED_VENUE_PHOTOS" api/restaurant-photo.js
      - name: Pure matcher checks
        run: |
          node <<'NODE'
          const p=require('./api/restaurant-photo.js')._test;
          const positive='<html><title>McDonald&#39;s</title><p>McDonald&#39;s 724 Sango Rd, Clarksville, TN 37043</p></html>';
          if(!p.pageMatchesRestaurant(positive,"McDonald's",'724 Sango Rd, Clarksville, TN 37043')) throw new Error('Positive exact-page match failed');
          if(p.pageMatchesRestaurant(positive,"McDonald's",'2285 Trenton Rd, Clarksville, TN 37040')) throw new Error('Cross-location page match was accepted');
          if(!p.isBlockedHost('https://images.unsplash.com/example.jpg')) throw new Error('Stock host was not blocked');
          console.log('Pure matcher checks: PASS');
          NODE
      - name: Diagnose Thirsty Goat discovery
        run: |
          node <<'NODE'
          const p=require('./api/restaurant-photo.js')._test;
          (async()=>{
            const pages=await p.findExactPages("The Thirsty Goat","4044 US-41 ALT, Clarksville, TN 37043","https://www.thirstygoatsango.com/");
            console.log("Discovered exact pages:",pages.map(x=>x.url));
            for(const page of pages.slice(0,5)){
              const candidates=p.collectPageImages(page.html,page.url,"The Thirsty Goat","4044 US-41 ALT, Clarksville, TN 37043",page.isOfficial);
              console.log("PAGE",page.url,"official",page.isOfficial,"candidates",candidates.slice(0,10).map(x=>({score:x.score,source:x.source,url:x.url,evidence:x.evidence})));
            }
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
      - name: Live exact-venue smoke test
        run: |
          node <<'NODE'
          const handler=require('./api/restaurant-photo.js');
          const cases=[
            {name:"McDonald's",address:"724 Sango Rd, Clarksville, TN 37043"},
            {name:"The Thirsty Goat",address:"4044 US-41 ALT South, Clarksville, TN 37043"},
            {name:"Ruby Tuesday",address:"2239 Madison St, Clarksville, TN 37043"},
            {name:"Chipotle Mexican Grill",address:"2296 Madison St, Clarksville, TN 37043"},
          ];
          const run=(input)=>new Promise((resolve,reject)=>{
            const chunks=[];
            const res={
              statusCode:200,
              headers:{},
              setHeader(k,v){this.headers[k]=v},
              end(v){chunks.push(v);resolve({statusCode:this.statusCode,headers:this.headers,body:Buffer.concat(chunks.map(x=>Buffer.isBuffer(x)?x:Buffer.from(x||'')))})}
            };
            handler({query:input},res).catch(reject);
          });
          (async()=>{
            for(const item of cases){
              const out=await run(item);
              const type=String(out.headers['Content-Type']||'');
              console.log(item.name, out.statusCode, type, out.body.length, out.headers['X-Restaurant-Photo-Source']||'');
              if(out.statusCode!==200)throw new Error(item.name+' did not return a verified image');
              if(!type.startsWith('image/'))throw new Error(item.name+' response was not an image');
              if(out.body.length<4000)throw new Error(item.name+' image was too small');
            }
            console.log('Live exact-venue smoke test: PASS');
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
