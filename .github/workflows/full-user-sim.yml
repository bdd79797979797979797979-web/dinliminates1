name: Dinliminate full user simulation (temporary)
on:
  push:
    branches: [ qa-full-user-sim-2026-09-27 ]
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --no-package-lock @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Start local QA server
        run: |
          node qa/local-smoke-server.mjs > /tmp/dinliminate-qa-server.log 2>&1 &
          echo $! > /tmp/dinliminate-qa-server.pid
      - name: Wait for local QA server
        run: node -e "const u='http://127.0.0.1:4173/'; const end=Date.now()+30000; (async()=>{while(Date.now()<end){try{const r=await fetch(u); const t=await r.text(); if(r.ok&&t.includes('Dinliminate')) process.exit(0)}catch{} await new Promise(s=>setTimeout(s,1000))} console.error('Local QA server did not start'); process.exit(1)})()"
      - name: Full simulated user journey
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test qa/full-user-sim.spec.mjs --reporter=line
