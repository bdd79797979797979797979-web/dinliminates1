name: CP641 official-site-first restaurant photo verification

on:
  push:
    branches:
      - cp641-official-site-first-photos

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and architecture
        run: |
          node --check api/restaurant-photo.js
          node --check api/restaurants.js
          node --check app.js
          grep -q "findVerifiedRestaurantPages" api/restaurant-photo.js
          grep -q "official-restaurant-site" api/restaurant-photo.js
          grep -q "verified-exact-public-photo" api/restaurant-photo.js
          ! grep -qE 'GOOGLE_PLACES_API_KEY|GOOGLE_MAPS_API_KEY' api/restaurant-photo.js
      - name: Official website precedence checks
        run: |
          node <<'NODE'
          const p=require('./api/restaurant-photo.js')._test;
          const cases=[
            {name:"The Thirsty Goat",address:"4044 Highway 41A South, Clarksville, TN 37043",website:"https://www.thirstygoatsango.com/"},
            {name:"Ruby Tuesday",address:"2239 Madison Street, Clarksville, TN 37043",website:"https://www.rubytuesday.com/locations/clarksville/"},
            {name:"Chipotle Mexican Grill",address:"2296 Madison St, Clarksville, TN 37043",website:"https://locations.chipotle.com/tn/clarksville/2296-madison-st"}
          ];
          (async()=>{
            for(const item of cases){
              const pages=await p.findVerifiedRestaurantPages(item.name,item.address,item.website);
              console.log(item.name, pages.slice(0,5).map(x=>({url:x.url,isOfficial:x.isOfficial})));
              if(pages.length && pages[0].isOfficial!==true) throw new Error(item.name+' did not put the restaurant-owned page first');
            }
            console.log('Official website precedence: PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Live restaurant photo smoke test
        run: |
          node <<'NODE'
          const handler=require('./api/restaurant-photo.js');
          const cases=[
            {name:"McDonald's",address:"724 Sango Rd, Clarksville, TN 37043",website:"https://www.mcdonalds.com/us/en-us/restaurant-locator.html"},
            {name:"The Thirsty Goat",address:"4044 Highway 41A South, Clarksville, TN 37043",website:"https://www.thirstygoatsango.com/"},
            {name:"Ruby Tuesday",address:"2239 Madison St, Clarksville, TN 37043",website:"https://www.rubytuesday.com/locations/clarksville/"},
            {name:"Chipotle Mexican Grill",address:"2296 Madison St, Clarksville, TN 37043",website:"https://locations.chipotle.com/tn/clarksville/2296-madison-st"}
          ];
          const run=(input)=>new Promise((resolve,reject)=>{
            const chunks=[];
            const res={statusCode:200,headers:{},setHeader(k,v){this.headers[k]=v},end(v){chunks.push(v);resolve({statusCode:this.statusCode,headers:this.headers,body:Buffer.concat(chunks.map(x=>Buffer.isBuffer(x)?x:Buffer.from(x||'')))})}};
            handler({query:input},res).catch(reject);
          });
          (async()=>{
            for(const item of cases){
              const out=await run(item);
              console.log(item.name, out.statusCode, out.headers['Content-Type']||'', out.body.length, out.headers['X-Restaurant-Photo-Source']||'', out.headers['X-Restaurant-Photo-Source-URL']||'');
              if(out.statusCode!==200)throw new Error(item.name+' photo did not resolve');
              if(!String(out.headers['Content-Type']||'').startsWith('image/'))throw new Error(item.name+' response is not an image');
              if(out.body.length<4000)throw new Error(item.name+' image is too small');
            }
            console.log('Live restaurant photo smoke test: PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
