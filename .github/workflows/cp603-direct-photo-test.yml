name: CP603 Direct Photo Test

on:
  push:
    branches: [cp603-photo-local-source-test]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test preview photo endpoint
        env:
          BASE_URL: https://deploy-preview-98--dinliminate.netlify.app
        run: |
          node <<'NODE'
          const base=process.env.BASE_URL;
          for (const [name,address] of [
            ["McDonald's","724 Sango Rd, Clarksville, TN 37043"],
            ["The Thirsty Goat","4044 US-41 ALT South, Clarksville, TN 37040"]
          ]) {
            const u=base+'/api/restaurant-photo?name='+encodeURIComponent(name)+'&address='+encodeURIComponent(address);
            const r=await fetch(u);
            const type=(r.headers.get('content-type')||'').split(';')[0];
            const source=r.headers.get('x-restaurant-photo-source')||'';
            const body=await r.text();
            let json=null; try{json=JSON.parse(body)}catch{}
            console.log(JSON.stringify({name,status:r.status,type,source,jsonSource:json?.source||'',jsonUrl:json?.url||'',bytes:body.length}));
          }
          NODE
