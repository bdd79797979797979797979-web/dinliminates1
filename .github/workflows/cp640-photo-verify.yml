name: CP640 restaurant photo verification

on:
  push:
    branches:
      - cp640-cp591-photo-fix-on-main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --experimental-fetch
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          node --check api/restaurant-photo.js
          node --check api/restaurants.js
          node --check app.js
      - name: Architecture checks
        run: |
          ! grep -qE 'GOOGLE_PLACES_API_KEY|GOOGLE_MAPS_API_KEY' api/restaurant-photo.js
          ! grep -qE 'images\.unsplash\.com|CATEGORY_IMAGES|function namedImage' api/restaurants.js
          grep -q "const restaurantFallback = (r)" app.js
          grep -q "params.set('osmPhoto'" app.js
          ! grep -q "URL.createObjectURL(blob)" app.js
          test -f data/verified-restaurant-photos.json
      - name: Pure checks
        run: |
          node <<'NODE'
          const p=require('./api/restaurant-photo.js')._test;
          const r=require('./api/restaurants.js')._test;
          const fake={name:"McDonald's",source:"Google Places Search",photo:"",category:"Fast Food"};
          const meta=r.restaurantPhotoMeta(fake);
          if(meta.photo)throw new Error('Generic/known-brand fallback still exists');
          if(p.verifiedRestaurantPhoto("McDonald's","2285 Trenton Rd, Clarksville, TN 37040")) throw new Error('Unexpected fixture match for wrong address');
          console.log('Pure checks: PASS');
          NODE
      - name: Live resolver smoke test
        run: |
          node <<'NODE'
          const handler=require('./api/restaurant-photo.js');
          const cases=[
            {name:"McDonald's",address:"724 Sango Rd, Clarksville, TN 37043"},
            {name:"The Thirsty Goat",address:"4044 US-41 ALT South, Clarksville, TN 37043"},
            {name:"Ruby Tuesday",address:"2239 Madison St, Clarksville, TN 37043"},
            {name:"Chipotle Mexican Grill",address:"2296 Madison St, Clarksville, TN 37043"}
          ];
          const run=(input)=>new Promise((resolve,reject)=>{
            const chunks=[];
            const res={
              statusCode:200,headers:{},
              setHeader(k,v){this.headers[k]=v},
              end(v){chunks.push(v);resolve({statusCode:this.statusCode,headers:this.headers,body:Buffer.concat(chunks.map(x=>Buffer.isBuffer(x)?x:Buffer.from(x||'')))})}
            };
            handler({query:input},res).catch(reject);
          });
          (async()=>{
            for(const item of cases){
              const out=await run(item);
              const type=String(out.headers['Content-Type']||'');
              const source=String(out.headers['X-Restaurant-Photo-Source']||'');
              const sourceUrl=String(out.headers['X-Restaurant-Photo-Source-URL']||'');
              console.log(item.name, out.statusCode, type, out.body.length, source, sourceUrl);
              if(out.statusCode!==200||!type.startsWith('image/')||out.body.length<4000||!source||!sourceUrl){
                throw new Error(item.name+' photo verification failed');
              }
            }
            console.log('Live resolver smoke test: PASS');
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
