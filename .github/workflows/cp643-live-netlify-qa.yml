name: CP643 Live Netlify Certification

on:
  push:
    branches:
      - cp643-restaurant-photo-rebuild

permissions:
  contents: read

jobs:
  live-netlify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Live preview certification
        env:
          BASE_URL: https://deploy-preview-117--dinliminate112.netlify.app
        run: node qa/cp643-live-photo-certification.mjs
