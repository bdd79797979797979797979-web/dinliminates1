[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/restaurant-search"
  to = "/.netlify/functions/restaurant-search"
  status = 200
  force = true

[[redirects]]
  from = "/api/restaurant-search/*"
  to = "/.netlify/functions/restaurant-search/:splat"
  status = 200
  force = true
